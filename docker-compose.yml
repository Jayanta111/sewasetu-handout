services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: ${SEWASETU_DB_PASSWORD:?Set SEWASETU_DB_PASSWORD in the deployment environment}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    environment:
      SEWASETU_ADMIN_USERNAME: ${SEWASETU_ADMIN_USERNAME:-}
      SEWASETU_ADMIN_PASSWORD: ${SEWASETU_ADMIN_PASSWORD:-}
      SEWASETU_FLASK_SECRET_KEY: ${SEWASETU_FLASK_SECRET_KEY:?Set SEWASETU_FLASK_SECRET_KEY in the deployment environment}
      SEWASETU_DB_PASSWORD: ${SEWASETU_DB_PASSWORD:?Set SEWASETU_DB_PASSWORD in the deployment environment}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: ./app
    command: ["cron", "-f"]
    environment:
      SEWASETU_DB_PASSWORD: ${SEWASETU_DB_PASSWORD:?Set SEWASETU_DB_PASSWORD in the deployment environment}
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
