{% extends "citizen_base.html" %}
{% block content %}
<div class="progress"><div class="progress-label"><strong>Step 1 of 6</strong><span>Verify your mobile</span></div><progress value="1" max="6" aria-label="Step 1 of 6"></progress></div>
<h1>Enter your OTP</h1>
<p class="muted">A one-time password was sent to {{ mobile }}. It is valid for 5 minutes.</p>
<form method="post">
  <div class="field"><label for="otp">6-digit OTP</label>
    <input id="otp" type="text" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" style="max-width:240px" required>
    <div class="help">If the code expires, request a new OTP from the previous page.</div>
  </div>
  <p><button class="button" type="submit">Verify and continue</button></p>
</form>
{% endblock %}
