{% extends "citizen_base.html" %}
{% block content %}
<h1>Check your application status</h1>
<p class="muted">Sign in using the mobile number and password you set or received.</p>
<form method="post">
  <div class="field"><label for="status-mobile">Mobile number</label>
    <input id="status-mobile" type="text" name="mobile" inputmode="numeric" autocomplete="tel-national" maxlength="10" required>
  </div>
  <div class="field"><label for="status-password">Password</label>
    <input id="status-password" type="password" name="password" autocomplete="current-password" required>
  </div>
  <p><button class="button" type="submit">Sign in</button></p>
</form>
<p><a href="/status/reset">Forgot your password?</a></p>
{% endblock %}
